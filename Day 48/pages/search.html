<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurugram | Explore</title>
    <link rel="shortcut icon" href="../images/favicon.png" type="image/x-icon">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/feed.css">
    <link rel="stylesheet" href="../style/search.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/settings.js"></script>
</head>

<body>
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="feed.html" class="nav-link"><i class="ri-home-line"></i></a>
        <a href="./search.html" class="nav-link active"><i class="ri-search-fill"></i></a>
        <a href="./create.html" class="nav-link"><i class="ri-add-box-line"></i></a>
        <a href="./notification.html" class="nav-link"><i class="ri-heart-line"></i></a>
        <a href="./profile.html" class="nav-link"><i class="ri-user-line"></i></a>
    </nav>

    <div class="search-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../images/logo.png" alt="Kurugram">
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="./feed.html" class="nav-link">
                        <i class="ri-home-line"></i>
                        <span class="nav-label">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./search.html" class="nav-link active">
                        <i class="ri-search-fill"></i>
                        <span class="nav-label">Search</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./explore.html" class="nav-link">
                        <i class="ri-compass-line"></i>
                        <span class="nav-label">Explore</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./messages.html" class="nav-link">
                        <i class="ri-messenger-line"></i>
                        <span class="nav-label">Messages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./notification.html" class="nav-link">
                        <i class="ri-heart-line"></i>
                        <span class="nav-label">Notifications</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./create.html" class="nav-link">
                        <i class="ri-add-box-line"></i>
                        <span class="nav-label">Create</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./profile.html" class="nav-link">
                        <i class="ri-user-line"></i>
                        <span class="nav-label">Profile</span>
                    </a>
                </li>
                <li class="nav-item logout-item">
                    <a href="javascript:void(0)" class="logout-link" onclick="logout()">
                        <i class="ri-logout-box-r-line"></i>
                        <span class="nav-label">Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Search Content -->
        <main class="search-content">
            <div class="search-header">
                <div class="search-input-container">
                    <i class="ri-search-line"></i>
                    <input type="text" placeholder="Search" id="searchInput">
                </div>
            </div>

            <div class="search-results-container">
                <div class="search-section-header">
                    <h3>Recent</h3>
                    <button class="clear-all-btn" id="clearAllBtn">Clear all</button>
                </div>

                <div class="search-results-list" id="searchResultsList">
                    <!-- User 1 -->
                    <div class="search-user-item">
                        <div class="search-user-info">
                            <img src="https://i.pravatar.cc/150?u=11" alt="User" class="search-user-avatar">
                            <div class="search-user-details">
                                <span class="search-username">sarah_style <i
                                        class="ri-verified-badge-fill verified-badge sm"></i></span>
                                <span class="search-fullname">Sarah Johnson</span>
                            </div>
                        </div>
                        <button class="remove-btn"><i class="ri-close-line"></i></button>
                    </div>

                    <!-- User 2 -->
                    <div class="search-user-item">
                        <div class="search-user-info">
                            <img src="https://i.pravatar.cc/150?u=12" alt="User" class="search-user-avatar">
                            <div class="search-user-details">
                                <span class="search-username">mike_vlogs</span>
                                <span class="search-fullname">Michael Chen</span>
                            </div>
                        </div>
                        <button class="remove-btn"><i class="ri-close-line"></i></button>
                    </div>

                    <!-- User 3 -->
                    <div class="search-user-item">
                        <div class="search-user-info">
                            <img src="https://i.pravatar.cc/150?u=13" alt="User" class="search-user-avatar">
                            <div class="search-user-details">
                                <span class="search-username">tech_guru <i
                                        class="ri-verified-badge-fill verified-badge sm"></i></span>
                                <span class="search-fullname">Alexander Wright</span>
                            </div>
                        </div>
                        <button class="remove-btn"><i class="ri-close-line"></i></button>
                    </div>

                    <!-- User 4 -->
                    <div class="search-user-item">
                        <div class="search-user-info">
                            <img src="https://i.pravatar.cc/150?u=14" alt="User" class="search-user-avatar">
                            <div class="search-user-details">
                                <span class="search-username">nature_lover</span>
                                <span class="search-fullname">Emma Watson</span>
                            </div>
                        </div>
                        <button class="remove-btn"><i class="ri-close-line"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/navigation.js"></script>
    <script src="../js/search-explore.js"></script>
</body>

</html>
