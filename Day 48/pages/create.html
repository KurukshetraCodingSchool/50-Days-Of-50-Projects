<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurugram | Create</title>
    <link rel="shortcut icon" href="../images/favicon.png" type="image/x-icon">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/feed.css">
    <link rel="stylesheet" href="../style/create.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/settings.js"></script>
</head>

<body>
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="feed.html" class="nav-link"><i class="ri-home-line"></i></a>
        <a href="search.html" class="nav-link"><i class="ri-search-line"></i></a>
        <a href="create.html" class="nav-link active"><i class="ri-add-box-fill"></i></a>
        <a href="notification.html" class="nav-link"><i class="ri-heart-line"></i></a>
        <a href="profile.html" class="nav-link"><i class="ri-user-line"></i></a>
    </nav>

    <div class="create-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="sidebar">
            <div class="logo">
                <a href="feed.html"><img src="../images/logo.png" alt="Kurugram"></a>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="./feed.html" class="nav-link">
                        <i class="ri-home-line"></i>
                        <span class="nav-label">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="search.html" class="nav-link">
                        <i class="ri-search-line"></i>
                        <span class="nav-label">Search</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./explore.html" class="nav-link">
                        <i class="ri-compass-line"></i>
                        <span class="nav-label">Explore</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="message.html" class="nav-link">
                        <i class="ri-messenger-line"></i>
                        <span class="nav-label">Messages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="notification.html" class="nav-link">
                        <i class="ri-heart-line"></i>
                        <span class="nav-label">Notifications</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./create.html" class="nav-link active">
                        <i class="ri-add-box-fill"></i>
                        <span class="nav-label">Create</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./profile.html" class="nav-link">
                        <i class="ri-user-line"></i>
                        <span class="nav-label">Profile</span>
                    </a>
                </li>
                <li class="nav-item logout-item">
                    <a href="javascript:void(0)" class="logout-link" onclick="logout()">
                        <i class="ri-logout-box-r-line"></i>
                        <span class="nav-label">Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="create-content">
            <div class="create-card">
                <div class="create-header">
                    <button class="btn-text btn-cancel" id="cancelPost">Cancel</button>
                    <span id="createHeaderTitle">Create new post</span>
                    <button class="btn-text btn-next" id="nextStep">Next</button>
                    <button class="btn-text btn-share" id="sharePost">Share</button>
                </div>
                <div class="create-body" id="createBody">
                    <!-- Step 1: Select -->
                    <div class="step-select" id="stepSelect">
                        <div class="upload-icon-container">
                            <i class="ri-image-add-line"></i>
                        </div>
                        <p>Drag photos and videos here</p>
                        <button class="btn-upload" id="selectBtn">Select from computer</button>
                        <input type="file" id="fileInput" hidden accept="image/*">
                    </div>

                    <!-- Step 2: Preview & Caption -->
                    <div class="step-preview" id="stepPreview" style="display: none;">
                        <div class="preview-container">
                            <img src="" alt="Preview" id="imagePreview">
                        </div>
                        <div class="post-details" id="postDetails">
                            <div class="user-info-sm">
                                <img src="https://i.pravatar.cc/150?u=10" alt="User" class="avatar-xs">
                                <span class="username">kurukshetra</span>
                            </div>
                            <textarea placeholder="Write a caption..." id="captionInput"></textarea>
                            <div class="accessibility-settings">
                                <div class="setting-item">
                                    <span>Add location</span>
                                    <i class="ri-map-pin-line"></i>
                                </div>
                                <div class="setting-item">
                                    <span>Accessibility</span>
                                    <i class="ri-arrow-down-s-line"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/navigation.js"></script>
    <script src="../js/create.js"></script>
</body>

</html>
