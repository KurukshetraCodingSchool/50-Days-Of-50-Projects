<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurugram | Explore</title>
    <link rel="shortcut icon" href="../images/favicon.png" type="image/x-icon">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/feed.css">
    <link rel="stylesheet" href="../style/search.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/auth-check.js"></script>
    <script src="../js/settings.js"></script>
</head>

<body>
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="./feed.html" class="nav-link"><i class="ri-home-line"></i></a>
        <a href="./search.html" class="nav-link"><i class="ri-search-line"></i></a>
        <a href="./create.html" class="nav-link"><i class="ri-add-box-line"></i></a>
        <a href="./notification.html" class="nav-link"><i class="ri-heart-line"></i></a>
        <a href="./profile.html" class="nav-link"><i class="ri-user-line"></i></a>
    </nav>

    <div class="search-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="sidebar">
            <div class="logo">
                <a href="feed.html"><img src="../images/logo.png" alt="Kurugram"></a>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="./feed.html" class="nav-link">
                        <i class="ri-home-line"></i>
                        <span class="nav-label">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="search.html" class="nav-link">
                        <i class="ri-search-line"></i>
                        <span class="nav-label">Search</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./explore.html" class="nav-link active">
                        <i class="ri-compass-fill"></i>
                        <span class="nav-label">Explore</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="message.html" class="nav-link">
                        <i class="ri-messenger-line"></i>
                        <span class="nav-label">Messages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="notification.html" class="nav-link">
                        <i class="ri-heart-line"></i>
                        <span class="nav-label">Notifications</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="create.html" class="nav-link">
                        <i class="ri-add-box-line"></i>
                        <span class="nav-label">Create</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="profile.html" class="nav-link">
                        <i class="ri-user-line"></i>
                        <span class="nav-label">Profile</span>
                    </a>
                </li>
                <li class="nav-item logout-item">
                    <a href="javascript:void(0)" class="logout-link" onclick="logout()">
                        <i class="ri-logout-box-r-line"></i>
                        <span class="nav-label">Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Search Content -->
        <main class="search-content">
            <div class="search-header">
                <div class="search-input-container">
                    <i class="ri-search-line"></i>
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="explore-grid">
                <!-- Grid Item 1 (Featured) -->
                <div class="explore-item featured">
                    <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&auto=format&fit=crop&q=60"
                        alt="Coding">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 12.4k</span>
                        <span><i class="ri-chat-3-fill"></i> 145</span>
                    </div>
                </div>
                <!-- Grid Item 2 -->
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?w=500&auto=format&fit=crop&q=60"
                        alt="Nature">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 3.5k</span>
                        <span><i class="ri-chat-3-fill"></i> 120</span>
                    </div>
                </div>
                <!-- Grid Item 3 -->
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=500&auto=format&fit=crop&q=60"
                        alt="Food">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 890</span>
                        <span><i class="ri-chat-3-fill"></i> 22</span>
                    </div>
                </div>
                <!-- Grid Item 4 -->
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1481487484168-9b930d5b41d5?w=500&auto=format&fit=crop&q=60"
                        alt="Tech">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 4.1k</span>
                        <span><i class="ri-chat-3-fill"></i> 300</span>
                    </div>
                </div>
                <!-- Grid Item 5 -->
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&auto=format&fit=crop&q=60"
                        alt="Model">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 2.8k</span>
                        <span><i class="ri-chat-3-fill"></i> 95</span>
                    </div>
                </div>
                <!-- Grid Item 6 (Featured) -->
                <div class="explore-item featured">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=60"
                        alt="Beach">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 25.6k</span>
                        <span><i class="ri-chat-3-fill"></i> 810</span>
                    </div>
                </div>
                <!-- Add more -->
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500&auto=format&fit=crop&q=60"
                        alt="Code">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 2k</span>
                        <span><i class="ri-chat-3-fill"></i> 80</span>
                    </div>
                </div>
                <div class="explore-item">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=60"
                        alt="Portrait">
                    <div class="explore-overlay">
                        <span><i class="ri-heart-fill"></i> 1.9k</span>
                        <span><i class="ri-chat-3-fill"></i> 50</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/navigation.js"></script>
    <script src="../js/search-explore.js"></script>
</body>

</html>
