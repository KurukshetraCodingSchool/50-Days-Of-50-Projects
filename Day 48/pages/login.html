<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurugram | Login</title>
    <link rel="shortcut icon" href="../images/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/login.css">
    <script src="../js/auth-check.js"></script>
</head>

<body>
    <main>
        <div class="login-container">
            <div class="background-blobs">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
            </div>
            <div class="login-card">
                <div class="logo">
                    <img src="../images/logo.png" alt="">
                </div>
                <form action="./feed.html">
                    <div class="input-group">
                        <input type="text" placeholder="Enter name" required>
                        <i class="ri-user-line"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Enter password" required>
                        <i class="ri-lock-2-line"></i>
                    </div>
                    <button type="submit" class="btn-primary">Log in</button>
                </form>
                <div class="divider">
                    <span>OR</span>
                </div>
                <a class="gmail-login"
                    href="https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&dsh=S-2128642760%3A1767118014637902&ifkv=Ac2yZaUeNyJqrYLJ0s7jNtC7vw67ewzLd8fqpeJG6Yri7ZOVz8PGJVk8e8shh7ouGwHCjR-k-RfNmA&rip=1&sacu=1&service=mail&flowName=GlifWebSignIn&flowEntry=ServiceLogin">
                    <i class="ri-google-fill"></i>
                    <span>Continue with Gmail</span>
                </a>
                <a href="">Forgot password?</a>
                <p>People who use our service may have uploaded your contact information to Instagram. Learn More</p>
            </div>
            <div class="signup-box">
                <p>Don't have an account? <a href="../pages/signup.html">Sign Up</a></p>
            </div>
            <div class="footer-links">
                <a href="">Meta</a>
                <a href="">About</a>
                <a href="">Blog</a>
                <a href="">Jobs</a>
                <a href="">Help</a>
                <a href="">API</a>
                <a href="">Privacy</a>
                <a href="">Terms</a>
                <a href="">Locations</a>
                <a href="">Contact Uploading & Non-Users</a>
                <span class="Copyright"><i class="ri-copyright-line"></i> 2026 Kurugram from Kurukshetra</span>

            </div>
        </div>
    </main>
    <script src="../js/auth.js"></script>
</body>

</html>
