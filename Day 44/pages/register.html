<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Shoes Factory</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-body">

    <div class="auth-card" style="max-width: 450px;">
        <h1>Create Account</h1>
        <p>Join the future of footwear</p>

        <form id="registerForm">
            <div>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div>
                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit">Register Now</button>
        </form>

        <p class="switch-auth">
            Already have an account? <a href="./login.html">Login here</a>
        </p>
        <p style="margin-top: 10px; font-size: 0.8rem;"><a href="../index.html">Back to Home</a></p>
    </div>

    <script src="../js/auth.js"></script>
</body>

</html>
