<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurugram | Create</title>
    <link rel="shortcut icon" href="../images/image copy 2.png" type="image/x-icon">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/feed.css">
    <link rel="stylesheet" href="../style/create.css">
</head>

<body>
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <a href="feed.html" class="nav-link"><i class="ri-home-line"></i></a>
        <a href="search.html" class="nav-link"><i class="ri-search-line"></i></a>
        <a href="create.html" class="nav-link active"><i class="ri-add-box-fill"></i></a>
        <a href="notification.html" class="nav-link"><i class="ri-heart-line"></i></a>
        <a href="profile.html" class="nav-link"><i class="ri-user-line"></i></a>
    </nav>

    <div class="create-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="sidebar">
            <div class="logo">
                <a href="feed.html"><img src="../images/logo.png" alt="Kurugram"></a>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="feed.html" class="nav-link">
                        <i class="ri-home-line"></i>
                        <span class="nav-label">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="search.html" class="nav-link">
                        <i class="ri-search-line"></i>
                        <span class="nav-label">Search</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="search.html" class="nav-link">
                        <i class="ri-compass-line"></i>
                        <span class="nav-label">Explore</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="message.html" class="nav-link">
                        <i class="ri-messenger-line"></i>
                        <span class="nav-label">Messages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="notification.html" class="nav-link">
                        <i class="ri-heart-line"></i>
                        <span class="nav-label">Notifications</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./create.html" class="nav-link active">
                        <i class="ri-add-box-fill"></i>
                        <span class="nav-label">Create</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="./profile.html" class="nav-link">
                        <i class="ri-user-line"></i>
                        <span class="nav-label">Profile</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="create-content">
            <div class="create-card">
                <div class="create-header">
                    Create new post
                </div>
                <div class="create-body">
                    <div class="upload-icon-container">
                        <i class="ri-image-add-line"></i>
                    </div>
                    <p>Drag photos and videos here</p>
                    <button class="btn-upload">Select from computer</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
